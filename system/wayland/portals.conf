# Which portal backend implements which org.freedesktop.portal.* interface.
#
# Linked to ~/.config/xdg-desktop-portal/portals.conf by system/wayland/default.nix,
# i.e. into $XDG_CONFIG_HOME, which outranks every system-wide location
# ($XDG_CONFIG_DIRS, $XDG_DATA_DIRS). xdg-desktop-portal also case-folds
# $XDG_CURRENT_DESKTOP and looks for `<desktop>-portals.conf` first, falling back
# to this one -- which is what makes "default" the list that actually applies.
#
# Order matters: the first backend in the list that implements the requested
# interface wins.
#
#   hyprland - ScreenCast, Screenshot, GlobalShortcuts, InputCapture, on top of
#             the Hyprland IPC socket. Must come first: xdg-desktop-portal-gnome
#             also claims ScreenCast, and picking it makes screen sharing hang
#             waiting for mutter, which does not exist under Hyprland.
#   gtk      - everything else that matters (FileChooser, Print, Settings, ...).
#             The gnome backend is left as an installed fallback but is never
#             preferred, since most of what it offers needs GNOME/mutter.
[preferred]
default=hyprland;gtk