# Palette and image paths are rendered by default.nix.
general {
    hide_cursor = true
    ignore_empty_input = true
}
background {
    monitor =
    path = @wallpaper@
    blur_passes = 2
    blur_size = 5
    brightness = 0.65
    color = rgb(@background@)
}
shape {
    monitor =
    size = 420, 300
    color = rgba(@surface@e8)
    rounding = 14
    border_size = 2
    border_color = rgb(@edge@)
    position = 0, -30
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 18
    shadow_color = rgba(08041088)
}
label {
    monitor =
    text = $TIME
    color = rgb(@text@)
    font_size = 72
    font_family = Segoe UI Light
    position = 0, 230
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date '+%A, %-d %B'
    color = rgb(@highlight@)
    font_size = 17
    font_family = Segoe UI
    position = 0, 155
    halign = center
    valign = center
}
image {
    monitor =
    path = @avatar@
    size = 64
    rounding = 10
    border_size = 1
    border_color = rgb(@highlight@)
    position = 0, 45
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = rgb(@text@)
    font_size = 22
    font_family = Segoe UI
    position = 0, -20
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    outer_color = rgb(@edge@)
    inner_color = rgb(@background@)
    font_color = rgb(@text@)
    check_color = rgb(@accent@)
    fail_color = rgb(@red@)
    capslock_color = rgb(@yellow@)
    rounding = 6
    fade_on_empty = false
    placeholder_text = Hasło
    fail_text = Nieprawidłowe hasło ($ATTEMPTS)
    dots_size = 0.22
    dots_spacing = 0.3
    position = 0, -83
    halign = center
    valign = center
}
label {
    monitor =
    text = Wpisz hasło i naciśnij Enter
    color = rgb(@muted@)
    font_size = 11
    font_family = Segoe UI
    position = 0, -140
    halign = center
    valign = center
}
